[package]
name = "display_switch"
version = "1.5.4"
authors = ["Haim Gelfenbeyn <haim@g8n.me>"]
edition = "2021"
description = "An utility to watch for USB device connect/disconnect events and switch display inputs via DDC/CI"
readme = "README.md"
repository = "https://github.com/haimgel/display-switch/"
homepage = "https://github.com/haimgel/display-switch/"
build = "build.rs"
license = "MIT"

[dependencies]
config = { version = "0.15", features = ["ini"], default-features = false }
paste = "1.0"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
simplelog = "0.12"
ddc = "0.2"
ddc-hi = "0.4"
rusb = "0.9"
shell-words = "1.1"
clap = { version = "4.6.1", features = ["derive"] }

[build-dependencies]
vergen-git2 = { version = "9.1.0", features = ["build", "cargo"] }

[target.'cfg(target_os = "macos")'.dependencies]
ddc-macos = "0.2.2"
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
ddc-i2c = "0.2"
uinput = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "libloaderapi", "wincon"] }
ddc-winapi = "0.2"
nvapi = "0.1"
# Until https://github.com/haimgel/ddc-macos-rs gets the fix, use a fork that writes each DDC
# request twice. A Philips 279P1 on DisplayPort answers nothing when it is written only once,
# so reading its input always failed. Patched rather than depended on directly, so that the
# copy used by `ddc-hi` is replaced as well.
[patch.crates-io]
ddc-macos = { git = "https://github.com/matthewpick/ddc-macos-rs", branch = "double-write" }
